<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Anthony Njau</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #08090D; --ink: #F1F5F9; --slate-300: #CBD5E1; --slate-400: #94A3B8; --slate-500: #64748B;
      --cyan: #22D3EE; --cyan-deep: #06B6D4; --indigo: #6366F1; --violet: #8B5CF6; --emerald: #34D399;
      --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --radius-lg: 20px; --radius-pill: 999px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    .glass-panel { background: rgba(14,17,27,0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    .radial-glow-cyan { background: radial-gradient(circle at center, rgba(34,211,238,0.16) 0%, rgba(34,211,238,0) 70%); }
    .glow-cyan { position: fixed; top: -10%; left: 50%; transform: translateX(-50%); width: 700px; height: 420px; filter: blur(130px); z-index: -1; pointer-events: none; }
    .gradient-btn { background: linear-gradient(90deg, var(--cyan-deep), var(--indigo), var(--violet)); transition: filter 0.2s ease, transform 0.2s ease; }
    .gradient-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }

    .wrap { max-width: min(820px, 92vw); margin: 0 auto; padding: 0 clamp(18px, 3vw, 32px); }

    header { padding: 32px 0 8px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500;
      color: var(--ink); text-decoration: none; padding: 9px 18px; border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.14); transition: background 0.2s;
    }
    .back-link:hover { background: rgba(255,255,255,0.08); }
    .back-link:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: var(--radius-pill); }

    main { padding: 36px 0 80px; }
    .state { padding: 60px 0; text-align: center; font-family: var(--mono); color: var(--slate-500); font-size: 13px; }
    .state a { color: var(--cyan); text-decoration: none; border-bottom: 1px solid var(--cyan); }

    .hero-img-wrap {
      width: 100%; aspect-ratio: 16/9; border-radius: var(--radius-lg); overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1); background: #11141F; margin-bottom: 28px;
    }
    .hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-img-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      color: var(--slate-500); font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
      background: repeating-linear-gradient(135deg, #0E111B, #0E111B 10px, #12151F 10px, #12151F 20px);
    }

    .featured-pill {
      display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: #08090D; background: var(--cyan); padding: 4px 12px; border-radius: var(--radius-pill); margin-bottom: 16px;
    }

    .detail h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -0.02em; color: #fff; margin: 0 0 16px; line-height: 1.1; }

    .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 26px; }
    .tag {
      font-family: var(--mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--cyan); background: rgba(34,211,238,0.08); padding: 4px 12px; border-radius: var(--radius-pill);
      border: 1px solid rgba(34,211,238,0.2);
    }

    .detail-desc { font-size: 15px; line-height: 1.75; color: var(--slate-300); max-width: 620px; margin-bottom: 32px; white-space: pre-line; }

    .visit-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 13px;
      color: #fff; font-weight: 600; font-size: 14px; text-decoration: none;
      box-shadow: 0 14px 30px -10px rgba(34,211,238,0.3);
    }
    .visit-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 13px; }

    footer { margin-top: 60px; padding: 26px 0 56px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12.5px; color: var(--slate-500); }
    footer a { color: var(--ink); text-decoration: none; }
    footer a:hover { color: var(--cyan); }

    @media (max-width: 600px) { header { padding: 24px 0 4px; } }
    @media (max-width: 420px) { .wrap { padding: 0 16px; } .visit-btn { width: 100%; justify-content: center; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>

<div class="glow-cyan radial-glow-cyan"></div>

<div class="wrap">
  <header>
    <a class="back-link" href="index.html">← Back to portfolio</a>
  </header>

  <main id="main">
    <p class="state">Loading project…</p>
  </main>

  <footer>
    <a href="index.html">Anthony Njau — Information Science</a>
  </footer>
</div>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDVfWCCyCGfbVhw3sQNIOTkYapfo7B9B1M",
    authDomain: "portfolio-management-ed2d5.firebaseapp.com",
    databaseURL: "https://portfolio-management-ed2d5-default-rtdb.firebaseio.com",
    projectId: "portfolio-management-ed2d5",
    storageBucket: "portfolio-management-ed2d5.firebasestorage.app",
    messagingSenderId: "307935862567",
    appId: "1:307935862567:web:9a3dce523d134c96bbd302",
    measurementId: "G-X797LW4YQB"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  function renderNotFound(message) {
    document.getElementById('main').innerHTML =
      '<div class="state">' + escapeHtml(message) + '<br><br><a href="index.html">← Back to all projects</a></div>';
  }

  var id = getIdFromUrl();
  if (!id) {
    renderNotFound('No project specified.');
  } else {
    var loaded = false;

    db.collection('projects').doc(id).get().then(function(doc) {
      loaded = true;
      if (!doc.exists) {
        renderNotFound('This project could not be found — it may have been removed.');
        return;
      }
      var p = doc.data();
      document.title = (p.title || 'Project') + ' — Anthony Njau';

      var tagsHtml = (p.tags || []).map(function(t) {
        return '<span class="tag">' + escapeHtml(t) + '</span>';
      }).join('');

      var imgHtml = p.image
        ? '<img class="hero-img" src="' + escapeHtml(p.image) + '" alt="' + escapeHtml(p.title) + '">'
        : '<div class="hero-img-placeholder">no image yet</div>';

      var ribbon = p.featured ? '<span class="featured-pill">Featured</span><br>' : '';
      var linkHtml = p.link
        ? '<a class="visit-btn gradient-btn" href="' + escapeHtml(p.link) + '" target="_blank" rel="noopener">Visit live project ↗</a>'
        : '';

      document.getElementById('main').innerHTML =
        '<div class="detail">' +
          '<div class="hero-img-wrap">' + imgHtml + '</div>' +
          ribbon +
          '<h1>' + escapeHtml(p.title || 'Untitled project') + '</h1>' +
          '<div class="detail-tags">' + tagsHtml + '</div>' +
          '<p class="detail-desc">' + escapeHtml(p.desc || '') + '</p>' +
          linkHtml +
        '</div>';
    }).catch(function(err) {
      loaded = true;
      renderNotFound('Could not load this project: ' + err.message);
    });

    setTimeout(function() {
      if (loaded) return;
      renderNotFound('Having trouble loading this project.');
    }, 7000);
  }
</script>
</body>
</html>
