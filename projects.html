<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Anthony Njau</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D0D0D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0D0D0D;
      --surface: rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.09);
      --line-soft: rgba(255,255,255,0.05);
      --ink: #F3F3F1;
      --ink-dim: #C8C8CC;
      --muted: #86868C;
      --accent: #6C8CFF;
      --accent-soft: rgba(108,140,255,0.14);
      --accent-line: rgba(108,140,255,0.35);
      --radius: 18px;
      --mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      --display: 'Space Grotesk', 'Inter', sans-serif;
      --body: 'Roboto', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body);
      line-height: 1.65; -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 85%);
    }
    .orb {
      position: fixed; z-index: 0; pointer-events: none;
      border-radius: 50%; filter: blur(90px); opacity: 0.25;
      animation: drift 26s ease-in-out infinite;
    }
    .orb-1 { width: 480px; height: 480px; top: -160px; left: -120px; background: radial-gradient(circle, var(--accent), transparent 70%); }
    @keyframes drift {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(30px,-24px) scale(1.06); }
    }

    .wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }

    header { padding: 40px 0 8px; }
    .back-link {
      font-family: var(--mono); font-size: 12.5px; font-weight: 500;
      color: var(--ink-dim); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 30px; border: 1px solid var(--line);
      background: var(--surface); transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .back-link:hover { border-color: var(--accent-line); color: #fff; background: var(--accent-soft); }
    .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    main { padding: 40px 0 80px; }

    .state { padding: 60px 0; text-align: center; font-family: var(--mono); color: var(--muted); font-size: 14px; }
    .state a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }

    .detail { opacity: 0; transform: translateY(14px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .detail.visible { opacity: 1; transform: translateY(0); }

    .hero-img-wrap {
      width: 100%; aspect-ratio: 16/9; border-radius: var(--radius);
      overflow: hidden; border: 1px solid var(--line); background: #1A1A1C;
      margin-bottom: 28px;
    }
    .hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-img-placeholder {
      width: 100%; height: 100%;
      background: repeating-linear-gradient(135deg, #171719, #171719 10px, #1B1B1E 10px, #1B1B1E 20px);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-family: var(--mono); font-size: 13px;
    }

    .featured-pill {
      display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--bg); background: var(--accent);
      padding: 4px 12px; border-radius: 30px; margin-bottom: 16px;
    }

    .detail h1 {
      font-family: var(--display); font-weight: 600; font-size: 34px;
      letter-spacing: -0.02em; color: #fff; margin: 0 0 14px;
    }

    .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
    .tag {
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      color: var(--accent); background: var(--accent-soft);
      padding: 4px 12px; border-radius: 30px; border: 1px solid var(--accent-line);
    }

    .detail-desc { font-size: 16px; color: var(--ink-dim); max-width: 620px; margin-bottom: 30px; white-space: pre-line; }

    .visit-btn {
      font-family: var(--mono); font-size: 13.5px; font-weight: 500;
      color: var(--bg); background: var(--accent); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 30px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .visit-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .visit-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 30px; }

    footer {
      margin-top: 60px; padding: 26px 0 56px; border-top: 1px solid var(--line-soft);
      font-family: var(--mono); font-size: 12.5px; color: var(--muted);
    }
    footer a { color: var(--ink-dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .detail h1 { font-size: 26px; }
      header { padding: 28px 0 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .detail, .orb { transition: none; animation: none; }
      .detail { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb-1"></div>

<div class="wrap">
  <header>
    <a class="back-link" href="index.html">← Back to portfolio</a>
  </header>

  <main id="main">
    <p class="state">Loading project…</p>
  </main>

  <footer>
    <a href="index.html">Anthony Njau — Information Science</a>
  </footer>
</div>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDVfWCCyCGfbVhw3sQNIOTkYapfo7B9B1M",
    authDomain: "portfolio-management-ed2d5.firebaseapp.com",
    databaseURL: "https://portfolio-management-ed2d5-default-rtdb.firebaseio.com",
    projectId: "portfolio-management-ed2d5",
    storageBucket: "portfolio-management-ed2d5.firebasestorage.app",
    messagingSenderId: "307935862567",
    appId: "1:307935862567:web:9a3dce523d134c96bbd302",
    measurementId: "G-X797LW4YQB"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  function renderNotFound(message) {
    document.getElementById('main').innerHTML =
      '<div class="state">' + escapeHtml(message) + '<br><br><a href="index.html">← Back to all projects</a></div>';
  }

  var id = getIdFromUrl();
  if (!id) {
    renderNotFound('No project specified.');
  } else {
    var loaded = false;

    db.collection('projects').doc(id).get().then(function(doc) {
      loaded = true;
      if (!doc.exists) {
        renderNotFound('This project could not be found — it may have been removed.');
        return;
      }
      var p = doc.data();
      document.title = (p.title || 'Project') + ' — Anthony Njau';

      var tagsHtml = (p.tags || []).map(function(t) {
        return '<span class="tag">' + escapeHtml(t) + '</span>';
      }).join('');

      var imgHtml = p.image
        ? '<img class="hero-img" src="' + escapeHtml(p.image) + '" alt="' + escapeHtml(p.title) + '">'
        : '<div class="hero-img-placeholder">no image yet</div>';

      var ribbon = p.featured ? '<span class="featured-pill">Featured</span><br>' : '';
      var linkHtml = p.link
        ? '<a class="visit-btn" href="' + escapeHtml(p.link) + '" target="_blank" rel="noopener">Visit live project ↗</a>'
        : '';

      document.getElementById('main').innerHTML =
        '<div class="detail" id="detail-block">' +
          '<div class="hero-img-wrap">' + imgHtml + '</div>' +
          ribbon +
          '<h1>' + escapeHtml(p.title || 'Untitled project') + '</h1>' +
          '<div class="detail-tags">' + tagsHtml + '</div>' +
          '<p class="detail-desc">' + escapeHtml(p.desc || '') + '</p>' +
          linkHtml +
        '</div>';

      setTimeout(function() {
        document.getElementById('detail-block').classList.add('visible');
      }, 60);
    }).catch(function(err) {
      loaded = true;
      renderNotFound('Could not load this project: ' + err.message);
    });

    setTimeout(function() {
      if (loaded) return;
      renderNotFound('Having trouble loading this project.');
    }, 7000);
  }
</script>
</body>
</html>
